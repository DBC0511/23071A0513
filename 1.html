<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <style>
    header, footer {
      background-color: #4a2c42;
    }
  </style>
</head>
<body>
  <header class="text-white text-center py-3">
    <h1>My Shop</h1>
    <nav>
      <a href="#register" class="text-white mx-2">Register</a>
      <a href="#login" class="text-white mx-2">Login</a>
      <a href="#catalog" class="text-white mx-2">Catalog</a>
      <a href="#cart" class="text-white mx-2">Cart</a>
    </nav>
  </header>

  <main class="container py-4">
    <!-- Register Section -->
    <section id="register" class="bg-white p-4 rounded shadow mb-4">
      <h2>Register</h2>
      <form id="registerForm">
        <input type="text" class="form-control mb-2" id="regUsername" placeholder="Username">
        <input type="email" class="form-control mb-2" id="regEmail" placeholder="Email">
        <input type="password" class="form-control mb-2" id="regPassword" placeholder="Password">
        <button type="submit" class="btn btn-warning w-100">Sign Up</button>
      </form>
    </section>

    <!-- Login Section -->
    <section id="login" class="bg-white p-4 rounded shadow mb-4">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" class="form-control mb-2" id="loginEmail" placeholder="Email">
        <input type="password" class="form-control mb-2" id="loginPassword" placeholder="Password">
        <button type="submit" class="btn btn-warning w-100">Login</button>
      </form>
    </section>

    <!-- Catalog Section -->
    <section id="catalog" class="row g-4 mb-4">
      <div class="col-sm-6 col-md-4">
        <div class="bg-light p-3 border rounded product text-center">
          <img src="https://images.pexels.com/photos/985635/pexels-photo-985635.jpeg?cs=srgb&dl=pexels-anne-363161-985635.jpg&fm=jpg" alt="Product 1" class="img-fluid mb-2" style="max-height: 150px;">
          <h3>Product 1</h3>
          <p>Price: $10</p>
          <button class="btn btn-warning w-100">Add to Cart</button>
        </div>
      </div>
      <div class="col-sm-6 col-md-4">
        <div class="bg-light p-3 border rounded product text-center">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEwhwV5ULAMEwzQVag3CjOc1ymmYwOYDX6pQ&s" alt="Product 2" class="img-fluid mb-2" style="max-height: 150px;">
          <h3>Product 2</h3>
          <p>Price: $15</p>
          <button class="btn btn-warning w-100">Add to Cart</button>
        </div>
      </div>
      <div class="col-sm-6 col-md-4">
        <div class="bg-light p-3 border rounded product text-center">
          <img src="https://i.etsystatic.com/18031810/r/il/23802c/5899034207/il_300x300.5899034207_qm73.jpg" alt="Product 3" class="img-fluid mb-2" style="max-height: 150px;">
          <h3>Product 3</h3>
          <p>Price: $20</p>
          <button class="btn btn-warning w-100">Add to Cart</button>
        </div>
      </div>
    </section>

    <!-- Cart Section -->
    <section id="cart" class="bg-white p-4 rounded shadow">
      <h2>Shopping Cart</h2>
      <p>No items in cart.</p>
    </section>
  </main>

  <footer class="text-white text-center py-3">
    <p>&copy; 2025 My Shop. All rights reserved.</p>
  </footer>
</body>
</html>
